name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]

    defaults:
      run:
        working-directory: win_fris_pyton

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formazas ellenorzese (ruff format)
        run: ruff format --check .

      - name: Tipusellenorzes (mypy)
        run: mypy

      - name: Tesztek (pytest)
        run: pytest -q

      - name: Konfiguracio ervenyessege
        run: python -m refreshswitcher check

  build:
    name: Windows exe build
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: win_fris_pyton
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm --clean RefreshSwitcher.spec
      - run: copy config.json dist\config.json
      - uses: actions/upload-artifact@v4
        with:
          name: RefreshSwitcher-windows
          path: |
            win_fris_pyton/dist/RefreshSwitcher.exe
            win_fris_pyton/dist/config.json
