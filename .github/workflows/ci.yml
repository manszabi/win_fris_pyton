name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Fuggosegek telepitese
        # A linter/tipusellenorzo verziok rogzitettek a requirements-dev.txt-ben,
        # hogy egy uj kiadasuk ne torje el a CI-t valtozatlan kodbazison.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Formazas ellenorzese (ruff format)
        run: python -m ruff format --check .

      - name: Tipusellenorzes (mypy)
        run: python -m mypy

      - name: Tesztek (pytest)
        run: python -m pytest -q

      - name: Konfiguracio ervenyessege
        run: python -m refreshswitcher check

  build:
    name: Windows exe build
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Fuggosegek telepitese
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Exe forditasa
        run: python -m PyInstaller --noconfirm --clean RefreshSwitcher.spec

      - name: Alapertelmezett config a dist melle
        run: Copy-Item config.json dist/config.json

      - uses: actions/upload-artifact@v4
        with:
          name: RefreshSwitcher-windows
          path: |
            dist/RefreshSwitcher.exe
            dist/config.json
